<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brand mark — green square with black P, slightly rotated.
       Mirrors the in-app nav logo. Uses system condensed fonts so
       it renders without external font loads. -->
  <g transform="rotate(-8 32 32)">
    <rect x="6" y="6" width="52" height="52" fill="#A8FF35"/>
    <text x="32" y="48" text-anchor="middle"
          font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif"
          font-weight="900"
          font-size="46"
          fill="#0A0A0A"
          letter-spacing="0.02em">P</text>
  </g>
</svg>
